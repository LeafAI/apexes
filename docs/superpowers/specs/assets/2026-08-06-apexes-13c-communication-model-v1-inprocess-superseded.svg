<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1060" viewBox="0 0 1240 1060" font-family="Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/>
    </marker>
  </defs>

  <style>
    .box-new { fill: #fff3cd; stroke: #b3261e; stroke-width: 1.5; stroke-dasharray: 5,3; }
    .box-existing { fill: #eef4ff; stroke: #2b5ea8; stroke-width: 1.5; }
    .box-mode { fill: #ffffff; stroke: #b3261e; stroke-width: 1.2; }
    .group { fill: none; stroke: #888; stroke-width: 1; stroke-dasharray: 4,3; }
    .title { font-size: 13px; font-weight: bold; fill: #111; }
    .sub { font-size: 10.5px; fill: #333; }
    .label { font-size: 10px; fill: #444; }
    .edge { stroke: #333; stroke-width: 1.4; fill: none; }
    .edge-new { stroke: #b3261e; stroke-width: 1.4; fill: none; }
    .legend-text { font-size: 11px; fill: #222; }
    .warn { font-size: 11px; fill: #b3261e; font-weight: bold; }
  </style>

  <rect x="0" y="0" width="1240" height="1060" fill="#fafafa"/>
  <text x="20" y="26" class="title" font-size="16">Apexes #13c: Strategy Monitoring &amp; Live Tuning Panel -- Communication Model</text>
  <text x="20" y="44" class="sub">existing (13a, blue solid) vs new (13c, red dashed) -- ALL boxes below live inside ONE OS process</text>

  <!-- Outer process boundary -->
  <rect x="20" y="60" width="1200" height="950" class="group"/>
  <text x="34" y="80" class="sub" font-style="italic">apexes-ui process (single OS process, single binary -- no separate backtest/paper/live process ever exists)</text>

  <!-- ================= Server task ================= -->
  <rect x="50" y="100" width="420" height="300" class="box-existing" rx="6"/>
  <text x="65" y="123" class="title">Server task (axum)</text>

  <rect x="65" y="135" width="390" height="30" class="box-existing" rx="4"/>
  <text x="75" y="155" class="sub">/ws  (13a) -- MarketEvent JSON, read-only</text>

  <rect x="65" y="173" width="390" height="30" class="box-new" rx="4"/>
  <text x="75" y="193" class="sub">/session/ws  (NEW) -- control in / snapshot out</text>

  <rect x="65" y="211" width="390" height="30" class="box-new" rx="4"/>
  <text x="75" y="231" class="sub">GET /session/strategies  (NEW)</text>

  <rect x="65" y="249" width="390" height="30" class="box-new" rx="4"/>
  <text x="75" y="269" class="sub">POST /session/launch  (NEW)</text>

  <rect x="65" y="287" width="390" height="30" class="box-new" rx="4"/>
  <text x="75" y="307" class="sub">POST /session/stop  (NEW)</text>

  <text x="65" y="335" class="label">Strategy listing source (for GET /session/strategies):</text>
  <text x="75" y="350" class="label">- Drift Script: scan ./strategies/*.drift (no registry needed)</text>
  <text x="75" y="365" class="label">- Rust-native: fixed compile-time table {name -&gt; fn() -&gt; Box&lt;dyn Strategy&gt;}</text>
  <text x="75" y="378" class="label">  (hand-edited per new struct; Rust has no runtime reflection)</text>

  <!-- ================= Client task ================= -->
  <rect x="990" y="100" width="220" height="230" class="box-existing" rx="6"/>
  <text x="1005" y="123" class="title">Client task</text>
  <text x="1005" y="140" class="sub">(existing 13a, extended 13c)</text>
  <text x="1005" y="165" class="label">- existing: consumes /ws</text>
  <text x="1015" y="179" class="label">(market events)</text>
  <text x="1005" y="199" class="label">- NEW: consumes /session/ws</text>
  <text x="1015" y="213" class="label">(snapshots)</text>
  <text x="1005" y="233" class="label">- NEW: sends control cmds</text>
  <text x="1015" y="247" class="label">(SetParam / Pause / Resume /</text>
  <text x="1015" y="261" class="label">Stop) via /session/ws</text>

  <!-- server task <-> client task, 3 parallel horizontal lines at distinct y -->
  <path d="M455,150 L990,150" class="edge" marker-end="url(#arrow)"/>
  <text x="620" y="145" class="label">market events (JSON)</text>

  <path d="M455,182 L990,182" class="edge-new" marker-end="url(#arrowRed)"/>
  <text x="620" y="177" class="label" fill="#b3261e">snapshot push (watch)</text>

  <path d="M990,214 L455,214" class="edge-new" marker-end="url(#arrowRed)"/>
  <text x="620" y="228" class="label" fill="#b3261e">control cmds (mpsc, into server)</text>

  <!-- ================= MarketEventBus ================= -->
  <rect x="50" y="430" width="180" height="80" class="box-existing" rx="6"/>
  <text x="65" y="454" class="sub">MarketEventBus</text>
  <text x="65" y="470" class="label">(existing, 13a)</text>
  <text x="65" y="486" class="label">one upstream conn,</text>
  <text x="65" y="500" class="label">shared across sessions</text>

  <path d="M150,400 L150,430" class="edge" marker-end="url(#arrow)"/>
  <text x="158" y="418" class="label">subscribe()</text>

  <!-- ================= SessionHandle ================= -->
  <rect x="270" y="430" width="680" height="410" class="box-new" rx="6"/>
  <text x="285" y="453" class="title">SessionHandle (NEW) -- owned by the server task, at most one active session</text>
  <text x="285" y="475" class="warn">Exactly ONE of these three runs at a time, chosen by /session/launch's `mode` field:</text>

  <path d="M460,400 L460,430" class="edge-new" marker-end="url(#arrowRed)"/>
  <text x="468" y="418" class="label" fill="#b3261e">owns / controls</text>

  <!-- Three mutually-exclusive mode boxes -->
  <rect x="285" y="490" width="200" height="86" class="box-mode" rx="5"/>
  <text x="297" y="510" class="sub">run_backtest</text>
  <text x="297" y="527" class="label">tokio::spawn'd task,</text>
  <text x="297" y="541" class="label">IN-PROCESS -- not a</text>
  <text x="297" y="555" class="label">separate OS process</text>
  <text x="297" y="569" class="label">(library fn, apexes-backtest)</text>

  <rect x="500" y="490" width="200" height="86" class="box-mode" rx="5"/>
  <text x="512" y="510" class="sub">run_paper_trading</text>
  <text x="512" y="527" class="label">tokio::spawn'd task,</text>
  <text x="512" y="541" class="label">IN-PROCESS -- not a</text>
  <text x="512" y="555" class="label">separate OS process</text>
  <text x="512" y="569" class="label">(library fn, apexes-paper)</text>

  <rect x="715" y="490" width="200" height="86" class="box-mode" rx="5"/>
  <text x="727" y="510" class="sub">run_live_trading</text>
  <text x="727" y="527" class="label">tokio::spawn'd task,</text>
  <text x="727" y="541" class="label">IN-PROCESS -- not a</text>
  <text x="727" y="555" class="label">separate OS process</text>
  <text x="727" y="569" class="label">(library fn, apexes-live-trading)</text>

  <!-- mode boxes -> ControlHandle -->
  <path d="M385,576 L385,594" class="edge-new" marker-end="url(#arrowRed)"/>
  <path d="M600,576 L600,594" class="edge-new" marker-end="url(#arrowRed)"/>
  <path d="M815,576 L815,594" class="edge-new" marker-end="url(#arrowRed)"/>

  <!-- ControlHandle -->
  <rect x="285" y="594" width="630" height="130" class="box-new" rx="5"/>
  <text x="297" y="615" class="sub">ControlHandle (NEW, passed into UnifiedLoopConfig -- same shape for all 3 modes)</text>
  <text x="305" y="634" class="label">watch channel OUT: per-tick monitoring snapshot, throttled to a configurable</text>
  <text x="315" y="648" class="label">min interval (default 500ms), computed inside apexes_backtest::unified_loop</text>
  <text x="305" y="666" class="label">mpsc channel IN: SetParam(name, value) / Pause / Resume / Stop</text>
  <text x="305" y="684" class="label">Pause semantics: strategy still consumes events (positions/PnL/margin</text>
  <text x="315" y="698" class="label">keep updating), but on_market_event is not called -- no new intents</text>
  <text x="305" y="716" class="label">Same ControlHandle instance is reused across all 3 modes -- only the</text>

  <!-- ControlHandle -> Registry -->
  <path d="M600,724 L600,736" class="edge-new" marker-end="url(#arrowRed)"/>

  <!-- Session's own Registry -->
  <rect x="285" y="736" width="630" height="66" class="box-new" rx="5"/>
  <text x="297" y="757" class="sub">Session's own Registry (ExecutionGateway / risk checker / etc.)</text>
  <text x="305" y="774" class="label">constructed at /session/launch time from the launch request + credentials</text>
  <text x="305" y="789" class="label">read by the launcher (env / local config file) -- gateway crates themselves never read env</text>

  <!-- ================= egui app ================= -->
  <rect x="990" y="360" width="220" height="260" class="box-new" rx="6"/>
  <text x="1005" y="383" class="title">egui/eframe app</text>
  <text x="1005" y="404" class="sub">- existing: market table</text>
  <text x="1015" y="418" class="label">+ conn status</text>
  <text x="1005" y="438" class="sub">- NEW: session launcher tab</text>
  <text x="1015" y="452" class="label">(mode / strategy / instruments /</text>
  <text x="1015" y="465" class="label">credentials-ref picker)</text>
  <text x="1005" y="485" class="sub">- NEW: monitoring tab</text>
  <text x="1015" y="499" class="label">(positions / balances / equity /</text>
  <text x="1015" y="512" class="label">realized_pnl / margin_status)</text>
  <text x="1005" y="532" class="sub">- NEW: param edit table</text>
  <text x="1015" y="546" class="label">(current values, editable,</text>
  <text x="1015" y="559" class="label">writes via /session/ws)</text>

  <path d="M1100,330 L1100,360" class="edge" marker-end="url(#arrow)"/>
  <text x="1108" y="348" class="label">channel(s)</text>

  <!-- launcher tab -> POST /session/launch (HTTP, orthogonal 3-segment) -->
  <path d="M990,438 L960,438 L960,264 L455,264" class="edge-new" marker-end="url(#arrowRed)" fill="none"/>
  <text x="700" y="257" class="label" fill="#b3261e">POST /session/launch (HTTP, one-shot)</text>

  <!-- ================= Strategy sources ================= -->
  <rect x="50" y="890" width="420" height="90" class="box-new" rx="6"/>
  <text x="65" y="913" class="title">Strategy sources (NEW, read by launcher)</text>
  <text x="75" y="934" class="label">./strategies/*.drift -- DriftScriptStrategy::from_file(path)</text>
  <text x="75" y="950" class="label">Rust-native table -- compile-time {name -&gt; fn() -&gt; Box&lt;dyn Strategy&gt;}</text>
  <text x="75" y="966" class="label">(per-tick param() calls inside a script -&gt; hot-reloadable via SetParam)</text>

  <!-- strategy sources -> run_backtest box left edge, orthogonal -->
  <path d="M260,890 L260,533 L285,533" class="edge-new" marker-end="url(#arrowRed)" fill="none"/>

  <!-- ================= Credentials source ================= -->
  <rect x="500" y="890" width="420" height="90" class="box-new" rx="6"/>
  <text x="515" y="913" class="title">Credentials (NEW, read by launcher only)</text>
  <text x="525" y="934" class="label">env vars / local config file, read by apexes-ui's launcher code</text>
  <text x="525" y="950" class="label">-&gt; passed into BinanceGatewayConfig::new(..) etc. at launch time</text>
  <text x="525" y="966" class="label">(gateway crates themselves never read env, per their own convention)</text>

  <!-- credentials -> Registry bottom edge, straight vertical -->
  <path d="M710,890 L710,802" class="edge-new" marker-end="url(#arrowRed)"/>

  <!-- ================= Legend ================= -->
  <rect x="50" y="1020" width="18" height="14" class="box-existing"/>
  <text x="76" y="1032" class="legend-text">existing (13a)</text>
  <rect x="220" y="1020" width="18" height="14" class="box-new"/>
  <text x="246" y="1032" class="legend-text">new (13c)</text>
  <path d="M 380 1027 L 430 1027" class="edge" marker-end="url(#arrow)"/>
  <text x="438" y="1032" class="legend-text">existing data flow</text>
  <path d="M 640 1027 L 690 1027" class="edge-new" marker-end="url(#arrowRed)"/>
  <text x="698" y="1032" class="legend-text">new data flow</text>
</svg>
