services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.12
    container_name: apexes-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: apexes
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - apexes-clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  postgres:
    image: postgres:17
    container_name: apexes-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: apexes
      POSTGRES_USER: apexes
      POSTGRES_PASSWORD: apexes
    volumes:
      - apexes-postgres-data:/var/lib/postgresql/data

  # --- application services -------------------------------------------
  # `docker compose up -d` starts the databases and the market-data
  # gateway. The live engine is opt-in: `docker compose --profile live up -d`
  # (see docs/RUNBOOK.md for the required environment and mounts).

  market-data-gateway:
    build:
      context: .
      target: gateway
    command: ["--host", "0.0.0.0", "--port", "9001", "--instruments", "BTCUSDT"]
    environment:
      # Optional bearer token for /market; the engine sends the same one.
      APEXES_GATEWAY_TOKEN: ${APEXES_GATEWAY_TOKEN:-}
    ports:
      - "127.0.0.1:9001:9001"
    restart: unless-stopped

  engine:
    profiles: ["live"]
    build:
      context: .
      target: engine
    depends_on:
      postgres:
        condition: service_started
      market-data-gateway:
        condition: service_healthy
    environment:
      # A live session REQUIRES control tokens and an audit log: the engine
      # refuses to start without them. Set APEXES_CONTROL_TOKENS
      # ("name:role:token,...") and/or the legacy APEXES_CONTROL_TOKEN.
      APEXES_CONTROL_TOKENS: ${APEXES_CONTROL_TOKENS:-}
      APEXES_CONTROL_TOKEN: ${APEXES_CONTROL_TOKEN:-}
      APEXES_AUDIT_LOG: /var/lib/apexes/audit.jsonl
      APEXES_GATEWAY_TOKEN: ${APEXES_GATEWAY_TOKEN:-}
      # Credentials for credentials_ref "binance-main" in the launch config.
      APEXES_CRED_BINANCE_MAIN_API_KEY: ${APEXES_CRED_BINANCE_MAIN_API_KEY:?set APEXES_CRED_BINANCE_MAIN_API_KEY}
      APEXES_CRED_BINANCE_MAIN_API_SECRET: ${APEXES_CRED_BINANCE_MAIN_API_SECRET:?set APEXES_CRED_BINANCE_MAIN_API_SECRET}
    volumes:
      - ./deploy/launch-config.json:/etc/apexes/launch-config.json:ro
      - ./deploy/strategy.drift:/etc/apexes/strategy.drift:ro
      - apexes-engine-data:/var/lib/apexes
    ports:
      - "127.0.0.1:9100:9100"
    # Restarts resume safely: startup recovery re-reads exchange state and
    # REFUSES to start (non-zero exit) if it cannot reconcile. Docker backs
    # off between attempts, so a refusal retries slowly rather than hammering
    # the exchange -- watch for the restart loop (RUNBOOK.md).
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  apexes-engine-data:
  apexes-clickhouse-data:
  apexes-postgres-data:
