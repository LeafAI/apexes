[workspace]
resolver = "3"
members = ["crates/apexes-core", "crates/apexes-cli", "crates/apexes-market-data", "crates/apexes-storage", "crates/apexes-backtest", "crates/apexes-strategy", "crates/apexes-indicators", "crates/apexes-optimize", "crates/apexes-strategy-registry", "crates/apexes-risk", "crates/apexes-paper", "crates/apexes-oms", "crates/apexes-gateway-binance", "crates/apexes-gateway-xtp", "crates/apexes-gateway-ibkr", "crates/apexes-live-trading", "crates/apexes-ems", "crates/apexes-account", "crates/apexes-market-data-chain", "crates/apexes-market-data-ashare", "crates/apexes-market-data-hshare", "crates/apexes-market-data-usequity", "crates/apexes-message-bus", "crates/apexes-ui", "crates/apexes-chart", "crates/apexes-market-data-gateway"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
rust_decimal = { version = "1.42", features = ["serde", "maths"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros"] }
futures = "0.3"
async-trait = "0.1.91"
uuid = { version = "1.24", features = ["v4", "serde"] }
clap = { version = "4.6", features = ["derive"] }
serde_json = "1.0"
barter-data = "0.11"
barter-instrument = "0.3"
tracing = "0.1"
clickhouse = { version = "0.15", features = ["chrono"] }
fixnum = { version = "0.9", features = ["i128", "serde"] }
barter = "0.12"
sha2 = "0.10"
rand = "0.10"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "chrono", "rust_decimal", "uuid"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
hmac = "0.12"
hex = "0.4"
axum = "0.8"
tracing-subscriber = "0.3"
eframe = "0.35"
egui = "0.35"
egui_kittest = { version = "0.35", features = ["eframe"] }
egui-wgpu = "0.35"
wgpu = "29.0"
bytemuck = { version = "1.25", features = ["derive"] }
core_affinity = "0.8.3"
