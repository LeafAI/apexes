[package]
name = "apexes-ui"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "apexes-ui"
path = "src/main.rs"

[dependencies]
apexes-core = { path = "../apexes-core" }
apexes-message-bus = { path = "../apexes-message-bus" }
apexes-market-data = { path = "../apexes-market-data" }
apexes-chart = { path = "../apexes-chart" }
apexes-backtest = { path = "../apexes-backtest" }
apexes-engine = { path = "../apexes-engine" }
apexes-security = { path = "../apexes-security" }
apexes-supervisor = { path = "../apexes-supervisor" }
apexes-strategy-loader = { path = "../apexes-strategy-loader" }
apexes-telemetry = { path = "../apexes-telemetry" }
chrono = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
axum = { workspace = true, features = ["ws"] }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true, features = ["env"] }
eframe = { workspace = true }
egui = { workspace = true }
egui_plot = { workspace = true }
rust_decimal = { workspace = true }

[dev-dependencies]
uuid = { workspace = true }
apexes-strategy = { path = "../apexes-strategy" }
apexes-oms = { path = "../apexes-oms" }
egui_kittest = { workspace = true }
rust_decimal_macros = "1.40"
chrono = { workspace = true }
