[package]
name = "apexes-engine"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "apexes-engine"
path = "src/main.rs"

[dependencies]
apexes-backtest = { path = "../apexes-backtest" }
apexes-core = { path = "../apexes-core" }
apexes-gateway-binance = { path = "../apexes-gateway-binance" }
apexes-live-trading = { path = "../apexes-live-trading" }
apexes-message-bus = { path = "../apexes-message-bus" }
apexes-oms = { path = "../apexes-oms" }
apexes-telemetry = { path = "../apexes-telemetry" }
apexes-security = { path = "../apexes-security" }
apexes-paper = { path = "../apexes-paper" }
apexes-risk = { path = "../apexes-risk" }
apexes-storage = { path = "../apexes-storage" }
apexes-strategy = { path = "../apexes-strategy" }
apexes-strategy-loader = { path = "../apexes-strategy-loader" }
async-trait = { workspace = true }
axum = { workspace = true, features = ["ws"] }
chrono = { workspace = true }
clap = { workspace = true }
core_affinity = { workspace = true }
futures = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
rust_decimal_macros = "1.40"
uuid = { workspace = true, features = ["v4"] }
